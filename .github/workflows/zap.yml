name: "OWASP ZAP Security Scan"

on:
  push:
    branches:
      - 'master'
  pull_request: {}
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: read

jobs:
  zap-baseline:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false

    - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Set up JDK 17
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
      with:
        distribution: 'temurin'
        java-version: 17

    - name: Build with Maven
      run: mvn --errors --show-version --batch-mode --no-transfer-progress package -DskipTests

    - name: OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@bbd6a2e60e373348b3774e958b38e42e7e24e64e
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
        target: 'https://commons.apache.org/proper/commons-collections/'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a -d -T 5'

  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false

    - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Set up JDK 17
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
      with:
        distribution: 'temurin'
        java-version: 17

    - name: OWASP Dependency Check
      run: mvn --errors --show-version --batch-mode --no-transfer-progress org.owasp:dependency-check-maven:check -Dformat=ALL -DprettyPrint=true

    - name: Upload Dependency Check Report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: dependency-check-report
        path: target/dependency-check-report.*
        retention-days: 14